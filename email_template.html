<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:32px 0;">
    <tr><td align="center">
      <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
        <tr>
          <td style="background:#2F5496;padding:28px 32px;">
            <h1 style="margin:0;color:#ffffff;font-size:22px;">{event}</h1>
            <p style="margin:6px 0 0;color:#c9d6ef;font-size:13px;">Your entry QR code is below</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;text-align:center;">
            <p style="margin:0 0 8px;font-size:16px;color:#222222;">Dear <strong>{name}</strong>,</p>
            <p style="margin:0 0 24px;font-size:14px;color:#555555;line-height:1.5;">
              Here is your personal QR code for {event}.<br>
              Present it at the entrance gate. It works <strong>only once</strong>.
            </p>
            <div style="display:inline-block;border:2px solid #2F5496;border-radius:12px;padding:16px;">
              <img src="cid:qrcode" alt="Entry QR code" width="200" height="200" style="display:block;">
            </div>
            <p style="margin:20px 0 0;font-size:12px;color:#888888;">
              Do not share this code. Once scanned, it cannot be used again.
            </p>
          </td>
        </tr>
        <tr>
          <td style="background:#f0f3f9;padding:16px 32px;">
            <p style="margin:0;font-size:12px;color:#777777;">See you at the gate!</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
